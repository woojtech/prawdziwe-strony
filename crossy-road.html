<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Crossy Road Retro Edition</title>
    <style>
        body {
            margin: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            user-select: none;
        }
        canvas {
            border: 6px solid #4CAF50;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            background: #000;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="600" height="600"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Wyłączenie wygładzania pikseli dla efektu Retro Pixel Art
ctx.imageSmoothingEnabled = false;

const grid = 40;
let gameState = "MENU"; // MENU, PLAYING, GAMEOVER
let score = 0;
let highScore = 0;
let maxRowReached = 14;

// --- GENERATOR TEKSTUR PIXEL ART (W pamięci podręcznej) ---
function createTexture(width, height, drawFn) {
    const texCanvas = document.createElement('canvas');
    texCanvas.width = width;
    texCanvas.height = height;
    const texCtx = texCanvas.getContext('2d');
    drawFn(texCtx);
    return texCanvas;
}

// 1. Tekstura trawy
const grassTex = createTexture(grid, grid, (c) => {
    c.fillStyle = "#2E7D32"; c.fillRect(0, 0, grid, grid);
    c.fillStyle = "#388E3C"; // Kępki jaśniejszej trawy
    for(let i=0; i<4; i++) {
        let x = Math.random()*(grid-6), y = Math.random()*(grid-6);
        c.fillRect(x, y, 4, 4); c.fillRect(x+2, y+2, 2, 4);
    }
});

// 2. Tekstura drogi (asfaltu)
const roadTex = createTexture(grid, grid, (c) => {
    c.fillStyle = "#424242"; c.fillRect(0, 0, grid, grid);
    c.fillStyle = "#616161"; // Chropowatość asfaltu
    for(let i=0; i<15; i++) {
        c.fillRect(Math.random()*grid, Math.random()*grid, 2, 2);
    }
});

// 3. Tekstura kurczaka (gracz)
const chickenTex = createTexture(grid, grid, (c) => {
    // Ciało (białe)
    c.fillStyle = "#FFFFFF"; c.fillRect(10, 8, 20, 24);
    // Skrzydło
    c.fillStyle = "#EEEEEE"; c.fillRect(8, 14, 14, 12);
    // Grzebień (czerwony)
    c.fillStyle = "#D32F2F"; c.fillRect(18, 2, 8, 6);
    // Dziób (żółty)
    c.fillStyle = "#FBC02D"; c.fillRect(28, 10, 6, 6);
    // Oko
    c.fillStyle = "#000000"; c.fillRect(24, 10, 2, 4);
    // Nogi
    c.fillStyle = "#F57C00"; c.fillRect(14, 32, 4, 6); c.fillRect(22, 32, 4, 6);
});

// 4. Tekstura auta
const carTex = createTexture(grid*2, grid, (c) => {
    // Karoseria główna
    c.fillStyle = "#E91E63"; c.fillRect(10, 6, 60, 28);
    // Dach / Szyby
    c.fillStyle = "#00BCD4"; c.fillRect(24, 10, 32, 20);
    c.fillStyle = "#333"; c.fillRect(36, 10, 4, 20); // Słupek boczny
    // Koła
    c.fillStyle = "#111";
    c.fillRect(16, 2, 12, 5); c.fillRect(52, 2, 12, 5);
    c.fillRect(16, 33, 12, 5); c.fillRect(52, 33, 12, 5);
    // Światła
    c.fillStyle = "#FFEB3B"; c.fillRect(68, 8, 2, 4); c.fillRect(68, 28, 2, 4);
});

// --- OBIEKTY GRY ---
const player = {
    x: 7 * grid,
    y: 14 * grid,
    width: grid,
    height: grid
};

class Car {
    constructor(laneY, speed) {
        this.width = grid * 2;
        this.height = grid;
        this.y = laneY;
        this.speed = speed;
        
        if (this.speed > 0) {
            this.x = -this.width - Math.random() * 300;
        } else {
            this.x = canvas.width + Math.random() * 300;
        }
    }

    update() {
        this.x += this.speed;
        if (this.speed > 0 && this.x > canvas.width) {
            this.x = -this.width - Math.random() * 200;
        } else if (this.speed < 0 && this.x < -this.width) {
            this.x = canvas.width + Math.random() * 200;
        }
    }

    draw() {
        ctx.save();
        // Odwrócenie tekstury auta, jeśli jedzie w lewo
        if (this.speed < 0) {
            ctx.translate(this.x + this.width, this.y);
            ctx.scale(-1, 1);
            ctx.drawImage(carTex, 0, 0);
        } else {
            ctx.drawImage(carTex, this.x, this.y);
        }
        ctx.restore();
    }
}

const lanes = [2, 3, 4, 6, 7, 8, 10, 11, 12];
const cars = [];
lanes.forEach((lane) => {
    const speed = (Math.random() * 2.5 + 2) * (Math.random() > 0.5 ? 1 : -1);
    cars.push(new Car(lane * grid, speed));
    cars.push(new Car(lane * grid, speed));
});

// --- STEROWANIE ---
window.addEventListener("keydown", (e) => {
    if (gameState === "MENU") {
        if (e.key === "Enter" || e.key === " ") {
            startGame();
        }
        return;
    }
    if (gameState === "GAMEOVER") {
        if (e.key === "Enter" || e.key === " ") {
            gameState = "MENU";
        }
        return;
    }

    let nextX = player.x;
    let nextY = player.y;

    if (e.key === "ArrowUp" || e.key === "w") nextY -= grid;
    if (e.key === "ArrowDown" || e.key === "s") nextY += grid;
    if (e.key === "ArrowLeft" || e.key === "a") nextX -= grid;
    if (e.key === "ArrowRight" || e.key === "d") nextX += grid;

    if (nextX >= 0 && nextX + player.width <= canvas.width) player.x = nextX;
    
    if (nextY >= 0 && nextY + player.height <= canvas.height) {
        player.y = nextY;
        let currentRow = player.y / grid;
        
        if (currentRow < maxRowReached) {
            score++;
            maxRowReached = currentRow;
            if (score > highScore) highScore = score;
        }
    }

    if (player.y <= 0) {
        player.y = 14 * grid;
        player.x = 7 * grid;
        maxRowReached = 14;
    }
});

function startGame() {
    score = 0;
    maxRowReached = 14;
    player.x = 7 * grid;
    player.y = 14 * grid;
    gameState = "PLAYING";
}

function checkCollision(rect1, rect2) {
    // Delikatny margines kolizji (hitbox mniejszy o 4px z każdej strony) dla lepszego gameplayu
    return rect1.x + 4 < rect2.x + rect2.width - 4 &&
           rect1.x + rect1.width - 4 > rect2.x + 4 &&
           rect1.y + 4 < rect2.y + rect2.height - 4 &&
           rect1.y + rect1.height - 4 > rect2.y + 4;
}

// --- RYSOWANIE EKRANÓW (MENU / GAME OVER) ---
function drawMenu() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#4CAF50";
    ctx.font = "bold 40px 'Courier New'";
    ctx.textAlign = "center";
    ctx.fillText("CROSSY ROAD", canvas.width / 2, 200);
    ctx.fillText("RETRO", canvas.width / 2, 250);

    // Mała grafika kurczaka w menu
    ctx.drawImage(chickenTex, canvas.width/2 - 20, 290, 40, 40);

    ctx.fillStyle = "#FFFFFF";
    ctx.font = "18px 'Courier New'";
    ctx.fillText("NACIŚNIJ [SPACJĘ] LUB [ENTER]", canvas.width / 2, 420);
    ctx.fillText("ABY ROZPOCZĄĆ GRĘ", canvas.width / 2, 450);

    ctx.fillStyle = "#888";
    ctx.font = "14px 'Courier New'";
    ctx.fillText("Sterowanie: Strzałki / WASD", canvas.width / 2, 540);
}

function drawGameOver() {
    ctx.fillStyle = "rgba(183, 28, 28, 0.9)"; // Czerwonawy przezroczysty filtr
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#FFFFFF";
    ctx.font = "bold 50px 'Courier New'";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", canvas.width / 2, 180);

    ctx.font = "22px 'Courier New'";
    ctx.fillText(`Twój wynik: ${score}`, canvas.width / 2, 280);
    ctx.fillStyle = "#FFEB3B";
    ctx.fillText(`Najlepszy wynik: ${highScore}`, canvas.width / 2, 320);

    ctx.fillStyle = "#FFFFFF";
    ctx.font = "16px 'Courier New'";
    ctx.fillText("NACIŚNIJ [ENTER], ABY WRÓCIĆ DO MENU", canvas.width / 2, 440);
}

// --- GŁÓWNA PĘTLA GRY ---
function gameLoop() {
    // 1. Rysowanie planszy (Tło jest widoczne pod menu)
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < canvas.height / grid; i++) {
        if (lanes.includes(i)) {
            // Rysowanie pasów asfaltu
            for(let x=0; x<canvas.width; x+=grid) {
                ctx.drawImage(roadTex, x, i * grid);
            }
            // Linie podziału jezdni (białe przerywane linie)
            ctx.fillStyle = "rgba(255,255,255,0.4)";
            if(i > 0 && lanes.includes(i-1)) {
                for(let lx=0; lx<canvas.width; lx+=40) {
                    ctx.fillRect(lx, i*grid - 1, 20, 2);
                }
            }
        } else {
            // Rysowanie trawy
            for(let x=0; x<canvas.width; x+=grid) {
                ctx.drawImage(grassTex, x, i * grid);
            }
        }
    }

    // 2. Logika i rysowanie aut
    cars.forEach((car) => {
        if (gameState === "PLAYING") car.update();
        car.draw();

        if (gameState === "PLAYING" && checkCollision(player, car)) {
            gameState = "GAMEOVER";
        }
    });

    // 3. Rysowanie gracza
    ctx.drawImage(chickenTex, player.x, player.y);

    // 4. Interfejs podczas rozgrywki
    if (gameState === "PLAYING") {
        ctx.fillStyle = "#fff";
        ctx.font = "bold 20px 'Courier New'";
        ctx.textAlign = "left";
        ctx.fillText(`PUNKTY: ${score}`, 20, 30);
        ctx.textAlign = "right";
        ctx.fillText(`TOP: ${highScore}`, canvas.width - 20, 30);
    }

    // 5. Obsługa stanów menu i ekranu śmierci
    if (gameState === "MENU") {
        drawMenu();
    } else if (gameState === "GAMEOVER") {
        drawGameOver();
    }

    requestAnimationFrame(gameLoop);
}

// Odpalenie pętli gry
gameLoop();
</script>

</body>
</html>
