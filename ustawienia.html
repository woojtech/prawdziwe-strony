<!DOCTYPE html>
<html lang="pl">
<head>
    <link rel="icon" type="image/png" href="./favicon.png"/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pomoc ❓</title>
    <style>
        body { font-family: sans-serif; background-color: #121214; color: #fff; padding: 30px; text-align: center; }
        .settings-card { background-color: #1f1f23; max-width: 450px; margin: 0 auto; padding: 25px; border-radius: 15px; border: 1px solid #3a3a42; text-align: left; }
        h1 { color: #00e5ff; text-align: center; }
        .setting-item { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px dashed #3a3a42; }
        label { font-size: 18px; font-weight: bold; display: block; margin-bottom: 10px; }
        .theme-box { background-color: #2d2d35; padding: 12px; border-radius: 8px; margin-bottom: 10px; font-size: 15px; }
        .back-btn { display: block; text-align: center; margin-top: 25px; color: #00e5ff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="settings-card">
    <h1>❓ Panel Pomocy i Ustawień</h1>
    
    <div class="setting-item">
        <label>🌗 Jak zmienić motyw strony?</label>
        <div class="theme-box">
            Aby zmienić motyw na jasny lub ciemny, użyj specjalnego, okrągłego przycisku <b>☀︎</b> bezpośrednio na górze strony głównej! 
        </div>
    </div>

    <div class="setting-item">
        <label>🎮 Szybki powrót do gier</label>
        <div class="theme-box">
            Twoje gry (Szalony Kucharz, Łapacz Deszczu) są zawsze gotowe na stronie głównej.
        </div>
    </div>

    <a href="index.html" class="back-btn">⬅️ Wróć do Prawdziwych Stron</a>
</div>

</body>
</html>
