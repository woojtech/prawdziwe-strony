<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Paint</title>
    <link rel="icon" type="image/png" href="./favicon.png"/>
    <style>
        body { text-align: center; font-family: sans-serif; background: #f0f0f0; margin: 20px; }
        canvas { border: 2px solid #000; background: #fff; cursor: crosshair; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .controls { background: #ddd; padding: 15px; margin-bottom: 10px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; align-items: center; border-radius: 8px; }
        button { cursor: pointer; padding: 8px 12px; border: 1px solid #999; border-radius: 4px; background: #fff; }
        button:hover { background: #eee; }
        .active { background: #4CAF50 !important; color: white; border-color: #388E3C; }
        label { font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Paint</h2>

    <div class="controls">
        <label>Kolor: <input type="color" id="colorPicker"></label>
        <label>Wielkość: <input type="range" id="lineWidth" min="1" max="50" value="5"></label>
        
        <div id="tools">
            <button onclick="setTool('pen')" id="btn-pen" class="active">Ołówek</button>
            <button onclick="setTool('eraser')" id="btn-eraser">Gumka</button>
            <button onclick="setTool('rect')" id="btn-rect">Kwadrat</button>
            <button onclick="setTool('circle')" id="btn-circle">Koło</button>
            <button onclick="setTool('text')" id="btn-text">Tekst</button>
        </div>

        <button onclick="clearCanvas()" style="margin-left: 20px; background: #ff4444; color: white;">Wyczyść wszystko</button>
    </div>

    <canvas id="paintCanvas" width="800" height="500"></canvas>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        let painting = false;
        let tool = 'pen';
        let startX, startY;
        let snapshot;

        function setTool(newTool) {
            tool = newTool;
            document.querySelectorAll('#tools button').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + newTool).classList.add('active');
        }

        function startPosition(e) {
            e.preventDefault(); // Zapobiegaj domyślnym zachowaniom (np. przewijaniu na dotyku)
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            startX = clientX - rect.left;
            startY = clientY - rect.top;

            if (tool === 'text') {
                addText(startX, startY);
                return;
            }

            painting = true;
            snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            if (tool === 'pen' || tool === 'eraser') draw(e);
        }

        function finishedPosition() {
            painting = false;
        }

        function draw(e) {
            if (!painting) return;

            e.preventDefault(); // Zapobiegaj domyślnym zachowaniom na dotyku
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const currentX = clientX - rect.left;
            const currentY = clientY - rect.top;
            const size = document.getElementById('lineWidth').value;

            ctx.lineWidth = size;
            ctx.lineCap = 'round';
            ctx.strokeStyle = (tool === 'eraser') ? '#ffffff' : document.getElementById('colorPicker').value;

            if (tool === 'pen' || tool === 'eraser') {
                ctx.lineTo(currentX, currentY);
                ctx.stroke();
            } else {
                ctx.putImageData(snapshot, 0, 0); // Przywróć obrazek, żeby nie "smużyć" kształtem
                if (tool === 'rect') {
                    ctx.strokeRect(startX, startY, currentX - startX, currentY - startY);
                } else if (tool === 'circle') {
                    let radius = Math.sqrt(Math.pow(currentX - startX, 2) + Math.pow(currentY - startY, 2));
                    ctx.beginPath();
                    ctx.arc(startX, startY, radius, 0, 2 * Math.PI);
                    ctx.stroke();
                }
            }
        }

        function addText(x, y) {
            const text = prompt("Wpisz tekst:");
            if (text) {
                const size = document.getElementById('lineWidth').value;
                ctx.font = `${size * 2}px Arial`; // Skalujemy czcionkę suwakiem wielkości
                ctx.fillStyle = document.getElementById('colorPicker').value;
                ctx.fillText(text, x, y);
            }
        }

        function clearCanvas() {
            if(confirm("Czy na pewno wyczyścić cały rysunek?")) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', finishedPosition);

        // Dodaj obsługę dotyku
        canvas.addEventListener('touchstart', startPosition);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', finishedPosition);
    </script>

</body>
</html>
